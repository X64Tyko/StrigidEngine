<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Trinyx Editor — UX Exploration</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Manrope", system-ui, sans-serif; background: #f0eee9; }
  body { overflow: hidden; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="foundation.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>
<script type="text/babel" src="hifi.jsx"></script>
<script type="text/babel" src="ideas.jsx"></script>
<script type="text/babel" src="ideas2.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const DC = window.DesignCanvas;
  const Sec = window.DCSection;
  const Art = window.DCArtboard;
  const PostIt = window.DCPostIt;
  return (
    <DC>
      {/* ── 01 · Direction ──────────────────────────────────────────── */}
      <Sec id="direction" title="01 · Direction"
                 subtitle="The proposal in one breath — a data-oriented editor for a data-oriented engine.">
        <Art id="brand" label="Wordmark + principles" width={920} height={540}>
          <window.FoundationBrand/>
        </Art>
        <PostIt>
          <strong>Stance.</strong> Take the proven 4-panel anchor from Unity/Unreal,
          throw out everything else, and design the rest around what Trinyx actually is:
          three threads, four tiers, a slab that's already a recording.
        </PostIt>
      </Sec>

      {/* ── 02 · Design System ─────────────────────────────────────── */}
      <Sec id="system" title="02 · Design system"
                 subtitle="Type, color, icons, components. Royal-purple + warm-yellow on a purple-tinted ink.">
        <Art id="color" label="Palette" width={760} height={540}>
          <window.FoundationColor/>
        </Art>
        <Art id="type" label="Type" width={760} height={540}>
          <window.FoundationType/>
        </Art>
        <Art id="icons" label="Icons" width={760} height={540}>
          <window.FoundationIcons/>
        </Art>
        <Art id="atoms" label="Buttons / chips / fields" width={760} height={540}>
          <window.FoundationComponents/>
        </Art>
      </Sec>

      {/* ── 03 · Wireframes ────────────────────────────────────────── */}
      <Sec id="wires" title="03 · Wireframes · IA exploration"
                 subtitle="Three layout bets. Per your read: A is the anchor, B (workspaces) is the working theory, C's palette gets pulled into both.">
        <Art id="wf-a" label="A · Classic 4-panel  ← anchor" width={1100} height={680}>
          <window.WireframeClassic/>
        </Art>
        <Art id="wf-b" label="B · Modal workspaces  ← direction" width={1100} height={680}>
          <window.WireframeWorkspaces/>
        </Art>
        <Art id="wf-c" label="C · Zen (palette source)" width={1100} height={680}>
          <window.WireframeZen/>
        </Art>
        <PostIt>
          <strong>Locked direction.</strong> A's familiar dock is the spatial floor.
          B's workspace pills swap which dock you see — Layout / Logic / Simulate /
          Network / Profile — and each workspace has a clear deliverable (shown below).
          C's palette rides on top of all of them.
        </PostIt>
      </Sec>

      {/* ── 04 · Hi-fi ─────────────────────────────────────────────── */}
      <Sec id="hifi" title="04 · Hi-fi · Layout workspace"
                 subtitle="Full polish at 1920×1080. Click the expand icon on the artboard to fullscreen.">
        <Art id="hifi-editor" label="Editor — Layout workspace · v2" width={1920} height={1080}>
          <window.HiFiEditor/>
        </Art>
        <PostIt>
          <strong>v2 corrections.</strong> World Outliner now has <em>Constructs</em>
          and <em>Archetypes → Chunks → Entities</em> as separate roots, matching
          ConstructRegistry + the archetype slab. Inspector now: queue at entity,
          tier+net at component, fields are pure values.
        </PostIt>
      </Sec>

      {/* ── 05 · Cross-cutting bets ───────────────────────────────── */}
      <Sec id="cross" title="05 · Cross-cutting bets"
                 subtitle="Modules that work in every workspace — palette is the universal verb, inspector is the universal noun.">
        <Art id="idea-cmd"  label="⌘K palette — on top of the editor" width={1280} height={780}>
          <window.IdeaCommandPalette/>
        </Art>
        <Art id="idea-part" label="Inspector · entity / component / field" width={1180} height={720}>
          <window.IdeaPartitionInspector/>
        </Art>
      </Sec>

      {/* ── 06 · Cache visualization ──────────────────────────────── */}
      <Sec id="cache" title="06 · Cache visualization"
                 subtitle="The slab two ways. Heatmap is what the engine sees; spreadsheet is what the dev edits.">
        <Art id="idea-heatmap" label="Slab heatmap (macro · GPU compute)" width={1280} height={780}>
          <window.IdeaSlabHeatmap/>
        </Art>
        <Art id="idea-slab" label="Slab spreadsheet (cells, editable)" width={1200} height={720}>
          <window.IdeaSlabView/>
        </Art>
      </Sec>

      {/* ── 07 · Workspace deliverables ───────────────────────────── */}
      <Sec id="workspaces" title="07 · Workspace deliverables"
                 subtitle="Each modal workspace pays its rent with one big tool. Justifies the switch.">
        <Art id="idea-script" label="Logic — node script + codegen" width={1300} height={780}>
          <window.IdeaVisualScript/>
        </Art>
        <Art id="idea-roll" label="Simulate — rollback scrubber" width={1200} height={720}>
          <window.IdeaScrubber/>
        </Art>
        <Art id="idea-net" label="Network — multi-window PIE + condition sim" width={1280} height={780}>
          <window.IdeaNetTopology/>
        </Art>
        <Art id="idea-jobs" label="Profile — job graph + critical path" width={1200} height={720}>
          <window.IdeaJobGraph/>
        </Art>
      </Sec>

      {/* ── 08 · Workflow accelerators ────────────────────────────── */}
      <Sec id="acc" title="08 · Workflow accelerators"
                 subtitle="Editor-as-codegen — boilerplate disappears.">
        <Art id="idea-compgen" label="Component generator" width={1200} height={720}>
          <window.IdeaComponentGen/>
        </Art>
        <PostIt>
          <strong>Next →</strong> when one direction lands, I'll prototype the
          workspace switcher as live React state and the ⌘K palette as a real
          interactive flow. The slab heatmap could go to a tiny WebGL/SVG fragment-shader
          proto too.
        </PostIt>
      </Sec>
    </DC>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
